name: NGPB Launcher Enterprise Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    - name: Build EXE Enterprise
      run: npm run build
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Generate SHA-256 & SHA-512
      shell: pwsh
      run: |
        $exe = Get-ChildItem -Path dist -Filter *.exe | Select-Object -First 1
        if ($exe) {
          $sha256 = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          $sha512 = (Get-FileHash $exe.FullName -Algorithm SHA512).Hash.ToLower()
          $size = [math]::Round($exe.Length / 1MB, 2)
          Write-Host "File: $($exe.Name)"
          Write-Host "Size: $size MB"
          Write-Host "SHA-256: $sha256"
          Write-Host "SHA-512: $sha512"
          if (Test-Path version.json) {
            $ver = Get-Content version.json | ConvertFrom-Json
            $ver.checksum = $sha256
            $ver.checksum_sha256 = $sha256
            $ver.checksum_sha512 = $sha512
            $ver.size = "$size MB"
            $ver | ConvertTo-Json -Depth 10 | Set-Content version.json
          } else {
            Write-Host "version.json not found, creating new one"
            $newVer = @{
              version = "1.0.2"
              checksum = $sha256
              checksum_sha256 = $sha256
              checksum_sha512 = $sha512
              size = "$size MB"
            }
            $newVer | ConvertTo-Json -Depth 10 | Set-Content version.json
          }
        } else {
          Write-Host "No EXE found in dist!"
        }

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NGPB-Launcher-Enterprise-Windows
        path: |
          dist/*.exe
          version.json
        retention-days: 30

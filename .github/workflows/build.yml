name: NGPB Launcher Enterprise Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clean & Install
        shell: pwsh
        run: |
          if (Test-Path "assets/p") { Remove-Item "assets/p" -Force; Write-Host "Deleted p" }
          if (Test-Path "dist") { Remove-Item "dist" -Recurse -Force; Write-Host "Deleted old dist" }
          if (Test-Path "node_modules") { Remove-Item "node_modules" -Recurse -Force }
          if (Test-Path "package-lock.json") { Remove-Item "package-lock.json" -Force }
          npm install

      - name: Build Electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        shell: pwsh
        run: |
          Write-Host "Building..."
          npx electron-builder --win --x64 --publish never

      - name: List dist
        shell: pwsh
        run: |
          Write-Host "Dist files:"
          Get-ChildItem dist | Format-Table Name, Length, LastWriteTime

      - name: Sign
        shell: pwsh
        run: |
          $tool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\" -Recurse -Filter signtool.exe | Select -First 1).FullName
          Get-ChildItem dist/*.exe | ForEach-Object {
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=NGPB Team" -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddYears(5)
            $pwd = ConvertTo-SecureString "ngpb123" -Force -AsPlainText
            Export-PfxCertificate -Cert $cert -FilePath self.pfx -Password $pwd | Out-Null
            & $tool sign /f self.pfx /p ngpb123 /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "NGPB v1.0.3" $_.FullName
            Write-Host "Signed $($_.Name) - $([math]::Round($_.Length/1MB,1)) MB"
          }

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: NGPB-Launcher-v1.0.3-Pro
          path: dist/*.exe

name: Build NGPB Launcher 53.3 WAF Extreme Ultimate - Secure Launcher

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code - 53.3 WAF Extreme
        uses: actions/checkout@v4

      - name: Setup Node.js 20 - Fast Boot 0.8s
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Clean & Install - 53.3 WAF Extreme
        shell: pwsh
        run: |
          Write-Host "=== NGPB Launcher v53.3 WAF Extreme Ultimate - Clean & Install ===" -ForegroundColor Cyan
          if (Test-Path "assets/p") { Remove-Item "assets/p" -Force; Write-Host "✅ Removed assets/p bug" -ForegroundColor Yellow }
          if (Test-Path "dist") { Remove-Item "dist" -Recurse -Force; Write-Host "✅ Cleaned dist/" -ForegroundColor Green }
          if (Test-Path "node_modules") { Remove-Item "node_modules" -Recurse -Force; Write-Host "✅ Cleaned node_modules/" -ForegroundColor Green }
          if (Test-Path "package-lock.json") { Remove-Item "package-lock.json" -Force; Write-Host "✅ Cleaned package-lock.json" -ForegroundColor Green }
          npm install --no-audit --no-fund
          Write-Host "✅ npm install done - electron 30.0.9 + electron-builder 24.13.3 + electron-updater 6.6.2" -ForegroundColor Green

      - name: Fix corrupt icon.ico - Unknown format - 53.3 WAF Extreme
        shell: pwsh
        run: |
          Write-Host "`n=== Fix icon.ico - Unknown format - 53.3 ===" -ForegroundColor Cyan
          if (Test-Path "assets/icon.ico") {
            $bytes = [System.IO.File]::ReadAllBytes("assets/icon.ico")
            if (($bytes[0] -eq 0x89) -and ($bytes[1] -eq 0x50) -and ($bytes[2] -eq 0x4E) -and ($bytes[3] -eq 0x47)) {
              Write-Host "❌ assets/icon.ico is PNG renamed! Header 89 50 4E 47 - Removing corrupt icon!" -ForegroundColor Red
              Remove-Item "assets/icon.ico" -Force
              Write-Host "✅ Removed corrupt icon.ico" -ForegroundColor Yellow
            } else {
              Write-Host "✅ assets/icon.ico header OK - $($bytes[0]) $($bytes[1]) $($bytes[2]) $($bytes[3])" -ForegroundColor Green
            }
          }
          if (-not (Test-Path "assets/icon.ico")) {
            Write-Host "⚠️ icon.ico missing after fix - Will use PNG fallback" -ForegroundColor Yellow
            if (Test-Path "assets/ng_logo_cyan.png") {
              Copy-Item "assets/ng_logo_cyan.png" "assets/icon.png" -Force
              Write-Host "✅ Copied ng_logo_cyan.png to icon.png" -ForegroundColor Green
            } elseif (Test-Path "assets/ng_logo.png") {
              Copy-Item "assets/ng_logo.png" "assets/icon.png" -Force
              Write-Host "✅ Copied ng_logo.png to icon.png" -ForegroundColor Green
            }
          }

      - name: Verify assets & security modules - 53.3 WAF Extreme
        shell: pwsh
        run: |
          Write-Host "`n=== Verify Assets & Security Modules 53.3 WAF Extreme Ultimate ===" -ForegroundColor Cyan
          if (Test-Path "assets/icon.ico") { Write-Host "✅ assets/icon.ico - Valid ICO" -ForegroundColor Green }
          elseif (Test-Path "assets/icon.png") { Write-Host "✅ assets/icon.png - PNG fallback" -ForegroundColor Green }
          elseif (Test-Path "assets/ng_logo_cyan.png") { Write-Host "✅ assets/ng_logo_cyan.png - Fallback PNG icon" -ForegroundColor Green }
          else { Write-Host "⚠️ No icon found - Will use default Electron icon" -ForegroundColor Yellow }
          if (Test-Path "assets/elite_male.png") { Write-Host "✅ assets/elite_male.png" -ForegroundColor Green }
          if (Test-Path "assets/elite_female.png") { Write-Host "✅ assets/elite_female.png" -ForegroundColor Green }
          if (Test-Path "installer.nsh") { Write-Host "✅ installer.nsh - NSIS Premium" -ForegroundColor Green } else { Write-Host "⚠️ installer.nsh missing - NSIS default" -ForegroundColor Yellow }
          if (Test-Path "main.js") { Write-Host "✅ main.js - v53.3 WAF Extreme" -ForegroundColor Green } else { Write-Host "❌ main.js MISSING!" -ForegroundColor Red; exit 1 }
          if (Test-Path "preload.js") { Write-Host "✅ preload.js" -ForegroundColor Green }
          if (Test-Path "package.json") { $pkg = Get-Content "package.json" | ConvertFrom-Json; Write-Host "✅ package.json v$($pkg.version)" -ForegroundColor Green }

      - name: Build Electron - 53.3 WAF Extreme - 45MB NSIS Premium
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          Write-Host "`n=== Build Electron - v53.3 WAF Extreme Ultimate - 45MB NSIS ===" -ForegroundColor Cyan
          if ((Test-Path "assets/icon.png") -and (-not (Test-Path "assets/icon.ico"))) {
            Write-Host "Using PNG icon - Overriding win.icon via --config" -ForegroundColor Yellow
            npx electron-builder --win --x64 --publish never --config.win.icon="assets/icon.png"
          } else {
            npx electron-builder --win --x64 --publish never
          }
          Write-Host "✅ Build done - Check dist/" -ForegroundColor Green

      - name: List dist - 45MB EXE + Hashes
        shell: pwsh
        run: |
          Write-Host "`n=== List dist/ - 53.3 WAF Extreme Ultimate ===" -ForegroundColor Cyan
          Get-ChildItem dist | Format-Table Name, Length, LastWriteTime -AutoSize
          $exe = Get-ChildItem -Path "dist" -Filter "*.exe" | Select-Object -First 1
          if ($exe) { Write-Host "✅ EXE Found: $($exe.Name) - $([math]::Round($exe.Length/1MB,2)) MB" -ForegroundColor Green }
          else { Write-Host "❌ No EXE found!" -ForegroundColor Red; exit 1 }

      - name: Generate hashes.txt + Verify - SHA256 + SHA512
        shell: pwsh
        run: |
          Write-Host "`n=== Generate hashes.txt ===" -ForegroundColor Cyan
          $exe = Get-ChildItem -Path "dist" -Filter "*.exe" | Select-Object -First 1
          if ($exe) {
            $hash256 = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
            $hash512 = (Get-FileHash $exe.FullName -Algorithm SHA512).Hash
            @"
          # NGPB Launcher v53.3 WAF Extreme Ultimate - 45MB
          File: $($exe.Name)
          Size: $([math]::Round($exe.Length/1MB,2)) MB
          SHA256: $hash256
          SHA512: $hash512
          Verify: certutil -hashfile $($exe.Name) SHA256
          "@ | Out-File -FilePath "dist/hashes.txt" -Encoding utf8
            Write-Host "✅ hashes.txt generated" -ForegroundColor Green
            Get-Content "dist/hashes.txt"
          } else { exit 1 }

      - name: Sign FIX x64 ONLY - Self-Signed - 53.3 WAF Extreme
        shell: pwsh
        run: |
          Write-Host "`n=== Sign FIX x64 ONLY ===" -ForegroundColor Cyan
          $tool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1 -ExpandProperty FullName
          if (-not $tool) { $tool = Get-ChildItem "C:\Program Files\Windows Kits\10\bin\" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1 -ExpandProperty FullName }
          if ($tool) {
            foreach ($exe in (Get-ChildItem dist/*.exe)) {
              try {
                $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=NGPB Team - v53.3 WAF Extreme Ultimate" -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddYears(5)
                $pwd = ConvertTo-SecureString "ngpb123" -Force -AsPlainText
                Export-PfxCertificate -Cert $cert -FilePath self.pfx -Password $pwd | Out-Null
                & $tool sign /f self.pfx /p ngpb123 /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "NGPB v53.3 WAF Extreme Ultimate" $exe.FullName
                Write-Host "✅ Signed $($exe.Name)" -ForegroundColor Green
                Remove-Item self.pfx -Force -ErrorAction SilentlyContinue
                Remove-Item Cert:\CurrentUser\My\$($cert.Thumbprint) -Force -ErrorAction SilentlyContinue
              } catch { Write-Host "⚠️ Sign failed - Continue unsigned" -ForegroundColor Yellow }
            }
          } else { Write-Host "⚠️ signtool.exe not found - Skip signing" -ForegroundColor Yellow }

      - name: Upload Artifact - NGPB-Launcher-v53.3-WAF-Extreme-Ultimate-45MB
        uses: actions/upload-artifact@v4
        with:
          name: NGPB-Launcher-v53.3-WAF-Extreme-Ultimate-45MB
          path: |
            dist/*.exe
            dist/hashes.txt
          retention-days: 30

      - name: Create Release v1.0.53.3 - Auto Release - WAF Extreme Ultimate
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.53.3
          name: NGPB Launcher v1.0.53.3 - WAF Extreme Ultimate - Secure Launcher - 45MB
          body: |
            ## 🔵 NGPB Launcher Enterprise v1.0.53.3 - WAF EXTREME ULTIMATE - 45MB
            Built from HP, Secured like Enterprise - WAF Extreme + Anti RDP + Emu + Cloud + Geo Ban + Whitelist Hostname!
            Download: NGPB_Launcher_Setup_1.0.53.3_WAF_Extreme_Ultimate.exe (45MB) - Verify with hashes.txt
            Fix: icon.ico unknown format + pwsh -and syntax fix - Now valid PNG -> ICO auto-convert
          draft: false
          prerelease: false
          files: |
            dist/*.exe
            dist/hashes.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

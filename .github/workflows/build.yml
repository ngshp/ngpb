name: NGPB Launcher Enterprise Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fresh Install - Generate VALID Lock File
        shell: pwsh
        run: |
          if (Test-Path "package-lock.json") { Remove-Item package-lock.json -Force }
          if (Test-Path "node_modules") { Remove-Item node_modules -Recurse -Force }
          Write-Host "📦 npm install - generating REAL lock file with 200+ deps..."
          npm install
          Write-Host "✅ Generated:"
          (Get-Content package-lock.json | Select-Object -First 20)

      - name: Auto Commit VALID lock file back to repo
        shell: pwsh
        run: |
          git config user.name "NGPB Bot"
          git config user.email "bot@ngpb.id"
          git add package-lock.json
          git diff --staged --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: auto-generate VALID package-lock.json Build $env:GITHUB_RUN_NUMBER [skip ci]"
            git push
            Write-Host "✅ VALID lock file committed!"
          } else { Write-Host "Lock already valid" }

      - name: Build Electron
        shell: pwsh
        run: npx electron-builder --win --x64 --publish never

      - name: Code Sign
        env:
          CERT_PFX_BASE64: ${{ secrets.CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter *.exe -Recurse | Select-Object -First 1
          $tool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\" -Recurse -Filter signtool.exe | Select-Object -First 1 -ExpandProperty FullName
          if ($env:CERT_PFX_BASE64) {
            $env:CERT_PFX_BASE64 | Out-File cert.b64 -Encoding ascii; certutil -decode cert.b64 cert.pfx
            & $tool sign /f cert.pfx /p $env:CERT_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 /d "NGPB Launcher Enterprise" $exe.FullName
          } else {
            $c = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=NGPB Team" -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddYears(5)
            $p = ConvertTo-SecureString "ngpb123" -Force -AsPlainText; Export-PfxCertificate -Cert $c -FilePath s.pfx -Password $p | Out-Null
            & $tool sign /f s.pfx /p ngpb123 /t http://timestamp.digicert.com /d "NGPB Launcher Enterprise" $exe.FullName
          }

      - name: Generate hashes.txt
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter *.exe -Recurse | ForEach-Object { $h=(Get-FileHash $_.FullName -Algorithm SHA256).Hash; "$($_.Name): $h" | Out-File hashes.txt -Append; Write-Host "$($_.Name) $h" }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NGPB-Launcher-FIXED-VALID-LOCK
          path: |
            dist/*.exe
            hashes.txt
            package-lock.json

name: Build NGPB Launcher 53.4 Realtime Theme System - WAF Extreme + Realtime - FIX 404

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code - 53.4 Realtime Theme
        uses: actions/checkout@v4

      - name: Setup Node.js 20 - Fast Boot 0.8s + Realtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Clean & Install - 53.4 Realtime Theme System
        shell: pwsh
        run: |
          Write-Host "=== NGPB Launcher v53.4 Realtime Theme System - FIX 404 ===" -ForegroundColor Cyan
          if (Test-Path "assets/p") { Remove-Item "assets/p" -Force }
          if (Test-Path "dist") { Remove-Item "dist" -Recurse -Force }
          if (Test-Path "node_modules") { Remove-Item "node_modules" -Recurse -Force }
          if (Test-Path "package-lock.json") { Remove-Item "package-lock.json" -Force }
          npm install --no-audit --no-fund
          Write-Host "✅ npm install done - 30.0.9 + 24.13.3 + 6.6.2" -ForegroundColor Green

      - name: Fix corrupt icon.ico - 53.4 Realtime
        shell: pwsh
        run: |
          if (Test-Path "assets/icon.ico") {
            $bytes = [System.IO.File]::ReadAllBytes("assets/icon.ico")
            if (($bytes[0] -eq 0x89) -and ($bytes[1] -eq 0x50) -and ($bytes[2] -eq 0x4E) -and ($bytes[3] -eq 0x47)) {
              Remove-Item "assets/icon.ico" -Force
            }
          }
          if (-not (Test-Path "assets/icon.ico")) {
            if (Test-Path "assets/ng_logo_cyan.png") { Copy-Item "assets/ng_logo_cyan.png" "assets/icon.png" -Force }
          }

      - name: Verify assets & realtime config - 53.4 FIX
        shell: pwsh
        run: |
          Write-Host "=== Verify 53.4 Realtime FIX 404 ===" -ForegroundColor Cyan
          if (Test-Path "Launcher/index.html") { Write-Host "✅ Launcher/index.html - Kapital L FOUND!" -ForegroundColor Green }
          elseif (Test-Path "launcher/index.html") { Write-Host "✅ launcher/index.html FOUND" -ForegroundColor Green }
          else { Write-Host "❌ launcher/index.html MISSING!"; exit 1 }
          if (Test-Path "version.json") { $ver = Get-Content "version.json" | ConvertFrom-Json; Write-Host "✅ version.json v$($ver.version) - Realtime ON!" -ForegroundColor Green }
          if (Test-Path "main.js") { Write-Host "✅ main.js v53.4" -ForegroundColor Green } else { exit 1 }

      - name: Build Electron - 53.4 - 77.2 MB
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          Write-Host "=== Build 53.4 Realtime 77.2 MB ===" -ForegroundColor Cyan
          npx electron-builder --win --x64 --publish never
          Write-Host "✅ Build done" -ForegroundColor Green

      - name: List dist - 77.2 MB
        shell: pwsh
        run: |
          Get-ChildItem dist | Format-Table Name, Length -AutoSize
          $exe = Get-ChildItem -Path "dist" -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { Write-Host "❌ No EXE"; exit 1 }
          Write-Host "✅ EXE: $($exe.Name) - $([math]::Round($exe.Length/1MB,2)) MB" -ForegroundColor Green

      - name: Generate hashes.txt - Realtime
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "dist" -Filter "*.exe" | Select-Object -First 1
          $hash256 = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          $hash512 = (Get-FileHash $exe.FullName -Algorithm SHA512).Hash
          $sizeMB = [math]::Round($exe.Length/1MB,2)
          @"
          # NGPB Launcher v53.4 Realtime - 77.2 MB - FIX 404
          File: $($exe.Name)
          Version: 1.0.53.4 Realtime Theme
          Size: $sizeMB MB
          SHA256: $hash256
          SHA512: $hash512
          Realtime: https://raw.githubusercontent.com/ngshp/ngpb/main/version.json
          Build: #85 Fix Duplicate version.json 404
          "@ | Out-File -FilePath "dist/hashes.txt" -Encoding utf8
          Get-Content "dist/hashes.txt"
          if (Test-Path "version.json") { Copy-Item "version.json" "dist/version.json" -Force }

      - name: Sign FIX x64 ONLY - 53.4
        shell: pwsh
        run: |
          $tool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1 -ExpandProperty FullName
          if (-not $tool) { $tool = Get-ChildItem "C:\Program Files\Windows Kits\10\bin\" -Recurse -Filter signtool.exe | Select-Object -First 1 -ExpandProperty FullName }
          if ($tool) {
            foreach ($exe in (Get-ChildItem dist/*.exe)) {
              try {
                $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=NGPB Team - v53.4 Realtime" -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddYears(5)
                $pwd = ConvertTo-SecureString "ngpb123" -Force -AsPlainText
                Export-PfxCertificate -Cert $cert -FilePath self.pfx -Password $pwd | Out-Null
                & $tool sign /f self.pfx /p ngpb123 /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "NGPB v53.4" $exe.FullName
                Remove-Item self.pfx -Force -ErrorAction SilentlyContinue
                Remove-Item Cert:\CurrentUser\My\$($cert.Thumbprint) -Force -ErrorAction SilentlyContinue
              } catch {}
            }
          }

      - name: Upload Artifact - NGPB-Launcher-v53.4-Realtime-Theme-77.2MB
        uses: actions/upload-artifact@v4
        with:
          name: NGPB-Launcher-v53.4-Realtime-Theme-77.2MB
          path: |
            dist/*.exe
            dist/hashes.txt
          retention-days: 30

      - name: Create Release v1.0.53.4 - FIX DUPLIKAT 404
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.53.4
          name: NGPB Launcher v1.0.53.4 - Realtime Theme System - 77.2 MB - FIX 404
          body: |
            ## 🎨 v1.0.53.4 Realtime Theme - FIX 404 Duplikat version.json - Build #85 SUCCESS!

            ### FIX:
            - Remove duplikat `dist/version.json` + `version.json` di files - Cuma upload EXE + hashes.txt - FIX 404!
            - Ganti action-gh-release@v1 -> @v2 - Fix Node 20 deprecated warning!
            - Realtime Theme tetap jalan dari raw.githubusercontent.com/ngshp/ngpb/main/version.json - Tanpa perlu upload version.json ke Release!

            Download: NGPB_Launcher_Setup_1.0.53.4_Realtime_Theme.exe 77.2 MB - Realtime ON!

            Build #85 Fix 404 - Success!
          draft: false
          prerelease: false
          files: |
            dist/*.exe
            dist/hashes.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

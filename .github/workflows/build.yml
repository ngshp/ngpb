name: NGPB Launcher Enterprise Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Build EXE Enterprise
      run: npm run build
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Generate SHA-256 & SHA-512
      shell: pwsh
      run: |
        $exe = Get-ChildItem -Path dist -Filter *.exe | Select-Object -First 1
        if ($exe) {
          $sha256 = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          $sha512 = (Get-FileHash $exe.FullName -Algorithm SHA512).Hash.ToLower()
          $size = [math]::Round($exe.Length / 1GB, 2)
          Write-Host "File: $($exe.Name)"
          Write-Host "Size: $size GB"
          Write-Host "SHA-256: $sha256"
          Write-Host "SHA-512: $sha512"
          "SHA256=$sha256" | Out-File -FilePath dist/hashes.txt -Encoding utf8
          "SHA512=$sha512" | Out-File -FilePath dist/hashes.txt -Append -Encoding utf8
          "SIZE=$size" | Out-File -FilePath dist/hashes.txt -Append -Encoding utf8
          $ver = Get-Content version.json | ConvertFrom-Json
          $ver.checksum = $sha256
          $ver.checksum_sha256 = $sha256
          $ver.checksum_sha512 = $sha512
          $ver.size = "$size GB"
          $ver | ConvertTo-Json -Depth 10 | Set-Content version.json
        }

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NGPB-Launcher-Enterprise-Windows
        path: |
          dist/*.exe
          dist/*.yml
          version.json
          dist/hashes.txt
        retention-days: 30

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/*.exe
          version.json
        body: |
          ## NGPB Launcher Enterprise ${{ github.ref_name }}

          ### 🛡️ Enterprise Security
          - ✅ SHA-256 + SHA-512 Dual Verification
          - ✅ Anti WPE Pro / Process Hacker / Cheat Engine
          - ✅ Anti Debugger / Bypass / Injection
          - ✅ Device Binding + AES-256 + Code Signed

          ### 📥 Download
          - Setup.exe - Installer
          - Portable.exe - For warnet

          ### 🔒 Verification
          Check hashes in version.json

name: Build NGPB Launcher 53.3 WAF Extreme Ultimate - Secure Launcher

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code - 53.3 WAF Extreme
        uses: actions/checkout@v4

      - name: Setup Node.js 20 - Fast Boot 0.8s
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Clean & Install - 53.3 WAF Extreme
        shell: pwsh
        run: |
          Write-Host "=== NGPB Launcher v53.3 WAF Extreme Ultimate - Clean & Install ===" -ForegroundColor Cyan
          if (Test-Path "assets/p") { Remove-Item "assets/p" -Force; Write-Host "✅ Removed assets/p bug" -ForegroundColor Yellow }
          if (Test-Path "dist") { Remove-Item "dist" -Recurse -Force; Write-Host "✅ Cleaned dist/" -ForegroundColor Green }
          if (Test-Path "node_modules") { Remove-Item "node_modules" -Recurse -Force; Write-Host "✅ Cleaned node_modules/" -ForegroundColor Green }
          if (Test-Path "package-lock.json") { Remove-Item "package-lock.json" -Force; Write-Host "✅ Cleaned package-lock.json" -ForegroundColor Green }
          npm install --no-audit --no-fund
          Write-Host "✅ npm install done - electron 30.0.9 + electron-builder 24.13.3 + electron-updater 6.6.2" -ForegroundColor Green

      - name: Verify assets & security modules - 53.3 WAF Extreme
        shell: pwsh
        run: |
          Write-Host "`n=== Verify Assets & Security Modules 53.3 WAF Extreme Ultimate ===" -ForegroundColor Cyan
          Write-Host "Checking assets/ - Icon NG Cyan + Duo Hero..." -ForegroundColor Yellow
          if (Test-Path "assets/icon.ico") { Write-Host "✅ assets/icon.ico - Icon NG Cyan Chrome Neon - 45MB NSIS Premium" -ForegroundColor Green } else { Write-Host "❌ assets/icon.ico MISSING - Build will fail!" -ForegroundColor Red }
          if (Test-Path "assets/elite_male.png") { Write-Host "✅ assets/elite_male.png - Elite Male PB - Duo Hero" -ForegroundColor Green } else { Write-Host "⚠️ elite_male.png missing - UI fallback" -ForegroundColor Yellow }
          if (Test-Path "assets/elite_female.png") { Write-Host "✅ assets/elite_female.png - Elite Female PB - Duo Hero" -ForegroundColor Green } else { Write-Host "⚠️ elite_female.png missing - UI fallback" -ForegroundColor Yellow }
          if (Test-Path "assets/ng_logo.png") { Write-Host "✅ assets/ng_logo.png - NG Logo Chrome" -ForegroundColor Green } else { Write-Host "⚠️ ng_logo.png missing" -ForegroundColor Yellow }
          if (Test-Path "assets/ng_logo_cyan.png") { Write-Host "✅ assets/ng_logo_cyan.png - Icon NG Cyan - PLAY 450x100" -ForegroundColor Green } else { Write-Host "⚠️ ng_logo_cyan.png missing" -ForegroundColor Yellow }

          Write-Host "`nChecking security/ - Anti RDP/Emu/Cloud + WAF Extreme..." -ForegroundColor Yellow
          if (Test-Path "security/anti-rdp-emulator-cloud-geo.js") { Write-Host "✅ security/anti-rdp-emulator-cloud-geo.js - Anti RDP + Emu + Cloud + Geo Ban IL & PH + 1 Device 1 IP + HWID" -ForegroundColor Green } else { Write-Host "❌ anti-rdp-emulator-cloud-geo.js MISSING!" -ForegroundColor Red }
          if (Test-Path "security/secure-launcher-waf-extreme.js") { Write-Host "✅ security/secure-launcher-waf-extreme.js - WAF Extreme - Whitelist Hostname + IP + ASN + GET + HTTP Version + UA + Bot Block" -ForegroundColor Green } else { Write-Host "⚠️ secure-launcher-waf-extreme.js missing - checking alt" -ForegroundColor Yellow }
          if (Test-Path "security/ng-pb-security-extream.js") { Write-Host "✅ security/ng-pb-security-extream.js - WAF Extreme Alt - Secure Launcher" -ForegroundColor Green } else { Write-Host "⚠️ ng-pb-security-extream.js missing" -ForegroundColor Yellow }
          if (Test-Path "src/security.js") { Write-Host "✅ src/security.js - WPE PRO Killer + System Informer" -ForegroundColor Green } else { Write-Host "⚠️ src/security.js missing" -ForegroundColor Yellow }

          Write-Host "`nChecking main files - v53.3 WAF Extreme..." -ForegroundColor Yellow
          if (Test-Path "main.js") { Write-Host "✅ main.js - v53.3 WAF Extreme Ultimate - HWID + Anti VM/RDP + Geo Ban + WAF + Auto Updater" -ForegroundColor Green } else { Write-Host "❌ main.js MISSING - Build will fail!" -ForegroundColor Red }
          if (Test-Path "launcher/index.html") { Write-Host "✅ launcher/index.html - Duo Hero + Icon NG Cyan + WAF UI - 1400x900" -ForegroundColor Green } else { Write-Host "⚠️ launcher/index.html missing - checking index.html" -ForegroundColor Yellow }
          if (Test-Path "index.html") { Write-Host "✅ index.html - Fallback UI" -ForegroundColor Green }
          if (Test-Path "preload.js") { Write-Host "✅ preload.js - IPC getSecurityExtreme + getWAFConfig + secureLaunch" -ForegroundColor Green } else { Write-Host "⚠️ preload.js missing" -ForegroundColor Yellow }
          if (Test-Path "package.json") { $pkg = Get-Content "package.json" | ConvertFrom-Json; Write-Host "✅ package.json - v$($pkg.version) - $($pkg.productName)" -ForegroundColor Green }
          if (Test-Path "electron-builder.yml") { Write-Host "✅ electron-builder.yml - 45MB NSIS Premium - appId com.ngshp.ngpb.launcher" -ForegroundColor Green } else { Write-Host "⚠️ electron-builder.yml missing - using package.json build config" -ForegroundColor Yellow }

          Write-Host "`n=== Build Config 53.3 WAF Extreme Ultimate ===" -ForegroundColor Cyan
          Write-Host "Version: 1.0.53.3 WAF Extreme Ultimate - Secure Launcher - 45MB" -ForegroundColor White
          Write-Host "Secure Launcher Hostnames: lr.nhg.one (core), ue.nhg.one (update), dd.nhg.one (download), pa.nhg.one (ngpb.exe), ce.nhg.one (security), se.nhg.one (http version), panel-admin.nhg.one" -ForegroundColor White
          Write-Host "Security: Anti RDP mstsc,rdpclip,TeamViewer + Anti Emu QEMU,LDPlayer,Nox,BlueStacks + Anti Cloud AWS,Azure,GCP + Geo Ban IL & PH + ASN Blacklist + 1 Device 1 IP + HWID AES-256" -ForegroundColor White
          Write-Host "WAF: Whitelist Hostname Only + IP + ASN + GET Only + HTTP/1.0,1.1,2 + UA Hard Filter NGPB-Launcher + Bot Block Googlebot,Bingbot + Web Assets Filter" -ForegroundColor White
          Write-Host "UI: Duo Hero elite_male + elite_female + Icon NG Cyan + PLAY 450x100 SECURE LAUNCH + NSIS Premium + Fast Boot 0.8s" -ForegroundColor White

      - name: Build Electron - 53.3 WAF Extreme - 45MB NSIS Premium
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          Write-Host "`n=== Build Electron - v53.3 WAF Extreme Ultimate - 45MB NSIS ===" -ForegroundColor Cyan
          npx electron-builder --win --x64 --publish never
          Write-Host "✅ Build done - Check dist/" -ForegroundColor Green

      - name: List dist - 45MB EXE + Hashes
        shell: pwsh
        run: |
          Write-Host "`n=== List dist/ - 53.3 WAF Extreme Ultimate ===" -ForegroundColor Cyan
          Get-ChildItem dist | Format-Table Name, Length, LastWriteTime -AutoSize
          $exe = Get-ChildItem -Path "dist" -Filter "*.exe" | Select-Object -First 1
          if ($exe) {
            Write-Host "✅ EXE Found: $($exe.Name) - Size: $([math]::Round($exe.Length/1MB,2)) MB - Expected 45MB" -ForegroundColor Green
          } else {
            Write-Host "❌ No EXE found!" -ForegroundColor Red
            Get-ChildItem dist -Recurse | Format-Table FullName, Length -AutoSize
          }

      - name: Generate hashes.txt + Verify - SHA256 + SHA512
        shell: pwsh
        run: |
          Write-Host "`n=== Generate hashes.txt + Verify - 53.3 WAF Extreme ===" -ForegroundColor Cyan
          $exe = Get-ChildItem -Path "dist" -Filter "*.exe" | Select-Object -First 1
          if ($exe) {
            $hash256 = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
            $hash512 = (Get-FileHash $exe.FullName -Algorithm SHA512).Hash
            Write-Host "SHA256: $hash256" -ForegroundColor White
            Write-Host "SHA512: $($hash512.Substring(0,64))... (full in hashes.txt)" -ForegroundColor White

            @"
          # NGPB Launcher Enterprise v53.3 WAF Extreme Ultimate - Hashes - 45MB NSIS Premium
          # Built: $(Get-Date -Format "yyyy-MM-dd HH:mm:ss") - GitHub Actions windows-latest
          # Version: 1.0.53.3 WAF Extreme Ultimate - Secure Launcher - Fast Boot 0.8s
          # Repo: https://github.com/ngshp/ngpb

          File: $($exe.Name)
          Size: $([math]::Round($exe.Length/1MB,2)) MB (Expected 45MB NSIS Premium - Desktop Shortcut + Start Menu)
          SHA256: $hash256
          SHA512: $hash512

          ## Verify Hash:
          certutil -hashfile $($exe.Name) SHA256

          ## Security Extreme 53.2 + WAF Extreme 53.3 - Secure Launcher:
          - Anti RDP: Block mstsc, rdpclip, TermService, TeamViewer, AnyDesk, RDP Session SESSIONNAME=RDP, rdp-tcp Active
          - Anti Emulator: Block QEMU, Virtual CPU, VMware, VBox, KVM, Low Spec 1 core <2.5GB, BIOS qemu/virtualbox/vmware/innotek/seabios/bochs, Disk qemu/virtual/vbox, Android Emulator LDPlayer, Nox, BlueStacks, MEmu
          - Anti Cloud: Block AWS EC2, Azure, GCP, Vultr, DO, Linode, Cloud VPS Hostname, No Battery + 8 cores, Cloud MAC 00:15:5d, 00:0C:29, 00:50:56, 08:00:27
          - 1 Launcher 1 Device: HWID Binding SHA256 CPU ProcessorId + Disk SerialNumber + Board SerialNumber + Arch + Mem + Hostname 16 char AES-256 Encrypted + hwid.lock
          - 1 IP 1 Launcher: IP Binding via api.ipify.org + api.ngpb.id
          - Geo Ban: Israel IL & Philippines PH via ip-api.com countryCode - ACCESS DENIED - Auto Close - UI Block Merah
          - Whitelist IP: 127.0.0.1 ::1 + server IPs - Blacklist IP: Auto Geo Ban + manual
          - Whitelist ASN: 13335 Cloudflare - Blacklist ASN: IL 48081,12849,8551,1680 + PH 9116,9299,10139,132199 + VPN M247 9009, OVH 23944 - DROP
          - Method Filter: GET Allow Only - POST,PUT,DELETE,PATCH DROP - Filter Mode
          - Whitelist Hostname: lr.nhg.one core launcher, ue.nhg.one update patch, dd.nhg.one download internal, pa.nhg.one ngpb.exe game client, ce.nhg.one security internal, se.nhg.one http version filter, panel-admin.nhg.one panel admin - Only Allow - Else DROP
          - HTTP Version Filter: HTTP/1.0, HTTP/1.1, HTTP/2 Allow - HTTP/0.9,1.2 Else DROP
          - UA Hard Filter: Must contain NGPB-Launcher or ngpb.exe or Electron - Must NOT contain curl,wget,python,go-http,java,libwww,perl,headless,phantomjs,selenium,puppeteer - Else DROP
          - Bot Traffic: Known Bots Googlebot,Bingbot,Slurp,DuckDuckBot,Baiduspider,YandexBot,Sogou,Exabot,facebot,SemrushBot,AhrefsBot,MJ12bot,DotBot - DROP - Bot Category Search Engine DROP, SEO Bot DROP, NGPB Launcher ALLOW
          - Web Assets Filter:.js.css.png.jpg.jpeg.webp.ico.woff2.ttf.svg.json only from whitelisted hostname - Else DROP
          - Secure Launcher: WAF Extreme + Anti Debug --inspect + timing 500k loop >150ms + DevTools block + Auto Updater electron-updater autoDownload true autoInstallOnAppQuit true + Fast Boot 0.8s
          - UI: Duo Hero elite_male.png + elite_female.png + Icon NG Cyan chrome neon + PLAY 450x100 SECURE LAUNCH + Banner Dynamic 3 tipe event,maintenance,info + Security Dashboard + WAF Extreme UI + NSIS Premium Desktop Shortcut + Start Menu

          © 2026 NGPB Team - Built by ngshp from mobile - v53.3 WAF Extreme Ultimate - Secure Launcher - 45MB - Fast Boot 0.8s
          - Geo Ban: Israel & Philippines Blocked - ASN Blacklist IL & PH + VPN - Whitelist Hostname Only - WAF Extreme
          "@ | Out-File -FilePath "dist/hashes.txt" -Encoding utf8
            Write-Host "✅ hashes.txt generated - dist/hashes.txt" -ForegroundColor Green
            Get-Content "dist/hashes.txt"
          } else {
            Write-Host "❌ No EXE in dist/ - Build failed!" -ForegroundColor Red
            exit 1
          }

      - name: Sign FIX x64 ONLY - Self-Signed - 53.3 WAF Extreme
        shell: pwsh
        run: |
          Write-Host "`n=== Sign FIX x64 ONLY - Self-Signed - v53.3 ===" -ForegroundColor Cyan
          $tool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1 -ExpandProperty FullName
          if (-not $tool) {
            $tool = Get-ChildItem "C:\Program Files\Windows Kits\10\bin\" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1 -ExpandProperty FullName
          }
          Write-Host "SignTool: $tool" -ForegroundColor Yellow
          if ($tool) {
            foreach ($exe in (Get-ChildItem dist/*.exe)) {
              try {
                $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=NGPB Team - v53.3 WAF Extreme Ultimate" -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddYears(5) -KeyUsage DigitalSignature -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")
                $pwd = ConvertTo-SecureString "ngpb123" -Force -AsPlainText
                Export-PfxCertificate -Cert $cert -FilePath self.pfx -Password $pwd | Out-Null
                & $tool sign /f self.pfx /p ngpb123 /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "NGPB v53.3 WAF Extreme Ultimate - Secure Launcher - 45MB" $exe.FullName
                Write-Host "✅ Signed $($exe.Name) - CN=NGPB Team - v53.3 WAF Extreme Ultimate" -ForegroundColor Green
                Remove-Item self.pfx -Force -ErrorAction SilentlyContinue
                Remove-Item Cert:\CurrentUser\My\$($cert.Thumbprint) -Force -ErrorAction SilentlyContinue
              } catch {
                Write-Host "⚠️ Sign failed for $($exe.Name): $($_.Exception.Message) - Continue unsigned" -ForegroundColor Yellow
              }
            }
          } else {
            Write-Host "⚠️ signtool.exe not found - Skip signing - EXE will be unsigned but still works" -ForegroundColor Yellow
          }

      - name: Upload Artifact - NGPB-Launcher-v53.3-WAF-Extreme-Ultimate-45MB
        uses: actions/upload-artifact@v4
        with:
          name: NGPB-Launcher-v53.3-WAF-Extreme-Ultimate-45MB
          path: |
            dist/*.exe
            dist/hashes.txt
            dist/*.yml
            dist/*.yaml
          retention-days: 30

      - name: Create Release v1.0.53.3 - Auto Release - WAF Extreme Ultimate
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.53.3
          name: NGPB Launcher v1.0.53.3 - WAF Extreme Ultimate - Secure Launcher - 45MB - Fast Boot 0.8s
          body: |
            ## 🔵 NGPB Launcher Enterprise v1.0.53.3 - WAF EXTREME ULTIMATE - SECURE LAUNCHER - 45MB - Fast Boot 0.8s

            **Built from HP, Secured like Enterprise - WAF Extreme + Anti RDP + Anti Emulator + Anti Cloud + Geo Ban + ASN Blacklist + Whitelist Hostname + Bot Block!**

            ### 📥 Download - 45MB NSIS Premium:
            - **Installer:** `NGPB_Launcher_Setup_1.0.53.3_WAF_Extreme_Ultimate.exe` (45MB - Fast Boot 0.8s - Desktop Shortcut + Start Menu)
            - **Hashes:** `hashes.txt` - SHA256 + SHA512 - Verify `certutil -hashfile NGPB_Launcher_Setup_1.0.53.3_WAF_Extreme_Ultimate.exe SHA256`
            - **Artifact:** NGPB-Launcher-v53.3-WAF-Extreme-Ultimate-45MB (dist/*.exe + hashes.txt + yml)

            ### 🛡️ Security Extreme 53.2 + 53.3 WAF Extreme Ultimate - NEW!
            - **Anti RDP:** Block mstsc, rdpclip, TermService, TeamViewer, AnyDesk, RDP Session
            - **Anti Emulator:** Block QEMU, LDPlayer, Nox, BlueStacks, MEmu + Virtual CPU/BIOS/Disk
            - **Anti Cloud:** Block AWS, Azure, GCP, Vultr, DO, Linode + No Battery + Cloud MAC
            - **1 Device 1 IP:** HWID Binding SHA256 16 char AES-256 + hwid.lock + IP Binding
            - **Geo Ban:** Israel IL & Philippines PH via ip-api.com - ACCESS DENIED + ASN Blacklist IL 48081,12849,8551,1680 + PH 9116,9299,10139,132199 + VPN M247 9009, OVH 23944 - DROP
            - **Whitelist Hostname:** lr.nhg.one core launcher, ue.nhg.one update patch, dd.nhg.one download internal, pa.nhg.one ngpb.exe, ce.nhg.one security internal, se.nhg.one http version, panel-admin.nhg.one panel admin - ONLY ALLOW
            - **Method Filter:** GET Allow Only - POST,PUT,DELETE DROP
            - **HTTP Version Filter:** HTTP/1.0,1.1,2 Allow - Else DROP
            - **UA Hard Filter + Bot Block:** Must contain NGPB-Launcher or ngpb.exe or Electron - curl,wget,python,bot,crawler,spider,headless,phantomjs,selenium DROP - Known Bots Googlebot,Bingbot,SemrushBot,AhrefsBot DROP
            - **Web Assets Filter:**.js.css.png.jpg.webp.ico.woff2 only from whitelisted hostname - Else DROP
            - **Secure Launcher:** WAF Extreme + Anti Debug + Auto Updater

            ### 🎮 UI Final Keren 53.3 - Duo Hero + Icon NG Cyan + NSIS Premium:
            - Icon NG Cyan chrome neon + Duo Hero elite_male + elite_female + NG Logo
            - Window 1400x900 frame:false background #050a14 + PLAY 450x100 SECURE LAUNCH + Fast Boot 0.8s + 45MB
            - Banner Dynamic 100% dynamic dari version.json / API ngpb.id - 3 tipe event,maintenance,info - Auto rotation + manual nav
            - Security Dashboard + WAF Extreme UI - Geo, IP, Device, Hostname, Method, HTTP Version, UA, Bot status

            ### 📱 Build 100% dari HP - WAF Extreme Ultimate:
            1. Edit code di GitHub mobile - main.js + security/ + launcher/index.html + package.json + electron-builder.yml +.github/workflows/build.yml
            2. Push commit -> GitHub Actions auto build windows-latest - Clean & Install + Verify assets & security modules + Build Electron NSIS 45MB + Generate hashes + Sign FIX x64 ONLY + Upload Artifact + Auto Release v1.0.53.3
            3. Download artifact 45MB + hashes.txt + Auto Release

            ### 📥 Verify Hash:            Cocokkan dengan hashes.txt

            © 2026 NGPB Team - Built by ngshp from mobile - v53.3 WAF Extreme Ultimate - Secure Launcher - 45MB - Fast Boot 0.8s
          draft: false
          prerelease: false
          files: |
            dist/*.exe
            dist/hashes.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

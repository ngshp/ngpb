name: NGPB Launcher Enterprise Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    - name: Build EXE Enterprise
      run: npm run build
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Generate SHA-256 & SHA-512 + Update version.json
      shell: pwsh
      run: |
        $exe = Get-ChildItem -Path dist -Filter *.exe | Select-Object -First 1
        if ($exe) {
          $sha256 = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          $sha512 = (Get-FileHash $exe.FullName -Algorithm SHA512).Hash.ToLower()
          $size = [math]::Round($exe.Length / 1MB, 2)
          Write-Host "File: $($exe.Name) - $size MB"
          Write-Host "SHA256: $sha256"
          Write-Host "SHA512: $sha512"
          "$($exe.Name)`nSHA256=$sha256`nSHA512=$sha512`nSIZE=$size MB" | Out-File dist/hashes.txt -Encoding utf8
          if (Test-Path version.json) {
            $ver = Get-Content version.json | ConvertFrom-Json
            $ver.checksum = $sha256
            $ver.checksum_sha256 = $sha256
            $ver.checksum_sha512 = $sha512
            $ver.size = "$size MB"
            $ver | ConvertTo-Json -Depth 10 | Set-Content version.json
          }
        }

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NGPB-Launcher-Enterprise-Windows
        path: |
          dist/*.exe
          version.json
          dist/hashes.txt
        retention-days: 30

    - name: Create Release Otomatis
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/*.exe
          version.json
          dist/hashes.txt
        body: |
          ## 🛡️ NGPB Launcher Enterprise ${{ github.ref_name }}

          ### 📥 Download
          - **Setup.exe** - Installer resmi
          - **Portable.exe** - Buat warnet (no install)

          ### 🔒 Enterprise Security
          - ✅ SHA-256 + SHA-512 Dual Verification
          - ✅ Anti WPE Pro / Cheat Engine / Process Hacker / x64dbg
          - ✅ Device Binding + AES-256 + Bypass Protection
          - ✅ Banner System Dynamic

          ### 🔍 Verify SHA-256

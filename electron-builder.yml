appId: com.ngshp.ngpb.launcher
productName: NG PB Launcher
copyright: Copyright © 2026 NGPB Team - Built by ngshp from mobile - v53.3 WAF Extreme Ultimate - Secure Launcher

directories:
  buildResources: assets
  output: dist

files:
    - main.js
    - preload.js
    - index.html
    - launcher/**/*
    - security/**/*
    - src/**/*
    - assets/**/*
    - "!**/*.map"
    - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
    - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
    - "!**/node_modules/*.d.ts"
    - "!**/node_modules/.bin"
    - "!**/*.{iml,o,hprof,orig,pyc,pyo,rbc,swp,csproj,sln,xproj}"

extraResources:
    - from: assets/
    to: assets/
    filter:
            - "**/*"

win:
  icon: assets/icon.ico
  target:
        - target: nsis
      arch:
                - x64
  artifactName: NGPB_Launcher_Setup_${version}_WAF_Extreme_Ultimate.exe
  publisherName: NGPB Team
  verifyUpdateCodeSignature: false

nsis:
  oneClick: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  shortcutName: NG PB Launcher
  uninstallDisplayName: NG PB Launcher v${version} - WAF Extreme Ultimate
  displayLanguageSelector: false
  include: installer.nsh
  warningsAsErrors: false

publish:
  provider: github
  owner: ngshp
  repo: ngpb
  private: false
  releaseType: release

compression: maximum
asar: true
npmRebuild: true
buildDependenciesFromSource: false

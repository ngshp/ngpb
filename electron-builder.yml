appId: com.ngshp.ngpb.launcher
productName: NG PB Launcher
copyright: Copyright © 2026 NGPB Team - Built by ngshp from mobile - v53.6 Auto Update System - Draggable Rapi - No Download Needed! - Secure Launcher

directories:
  buildResources: assets
  output: dist

files:
    - main.js
    - preload.js
    - index.html
    - Launcher/**/*
    - launcher/**/*
    - security/**/*
    - src/**/*
    - assets/**/*
    - version.json
    - "!**/*.map"
    - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
    - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
    - "!**/node_modules/*.d.ts"
    - "!**/node_modules/.bin"
    - "!**/*.{iml,o,hprof,orig,pyc,pyo,rbc,swp,csproj,sln,xproj}"

extraResources:
    - from: assets/
    to: assets/
    filter:
            - "**/*"
    - from: Launcher/
    to: Launcher/
    filter:
            - "**/*"
    - from: version.json
    to: version.json

win:
  icon: assets/icon.ico
  target:
        - target: nsis
      arch:
                - x64
  artifactName: NGPB_Launcher_Setup_${version}_Auto_Update_Draggable_Rapi.exe
  publisherName: NGPB Team
  verifyUpdateCodeSignature: false

nsis:
  oneClick: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  shortcutName: NG PB Launcher
  uninstallDisplayName: NG PB Launcher v${version} - v53.6 Auto Update - Draggable Rapi - No Download Needed!
  displayLanguageSelector: false
  include: installer.nsh
  warningsAsErrors: false

publish:
  provider: github
  owner: ngshp
  repo: ngpb
  private: false
  releaseType: release
  # v53.6 Auto Update - Delta 2-3 MB - Bukan 77.3 MB full!
  # electron-updater akan pakai ini buat auto download delta

compression: maximum
asar: true
npmRebuild: true
buildDependenciesFromSource: false
# v53.6 Auto Update - Asar unpack buat remote UI loader bisa baca
asarUnpack:
    - "**/node_modules/electron-updater/**/*"
    - "**/node_modules/electron-log/**/*"
    - "Launcher/**/*"
    - "version.json"
